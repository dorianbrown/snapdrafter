name: Publish to internal testers

on:
  push:
    branches: [ "qa" ]
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Pub Get
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub

      - name: Build Unsigned App Bundle
        run: |
          OFFSET=40
          BUILD_NUM=$((${{ github.run_number }} + $OFFSET))
          flutter build appbundle --build-number $BUILD_NUM --no-pub

      - name: Sign App Bundle
        id: sign_app
        run: |
          AAB_FILE=$(ls build/app/outputs/bundle/release/*.aab | head -1)
          echo "$KEYSTORE" | base64 --decode > release.jks
          jarsigner -keystore release.jks \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            "$AAB_FILE" "$ALIAS"
          rm release.jks
          echo "signedReleaseFile=$AAB_FILE" >> "$GITHUB_OUTPUT"
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.dbrown.mtg_draft_tracker
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          mappingFile: ./build/app/outputs/mapping/release/mapping.txt
          debugSymbols: ./build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
          whatsNewDirectory: ./whatsnew
          tracks: internal
          status: completed

  build_ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Signing Certificates
        uses: Apple-Actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Download Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@v5
        with:
          bundle-id: com.dorianbrown.snapdrafter
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download Provisioning Profiles for Extension
        uses: Apple-Actions/download-provisioning-profiles@v5
        with:
          bundle-id: com.dorianbrown.snapdrafter.shareintent
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache Pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Pub Get
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build App IPA
        run: |
          OFFSET=40
          BUILD_NUM=$((${{ github.run_number }} + $OFFSET))

          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          BUILD_NAME="$MAJOR_MINOR.$BUILD_NUM"

          flutter build ipa \
            --build-number=$BUILD_NUM \
            --build-name=$BUILD_NAME \
            --export-options-plist=ios/GithubActionsExportOptions.plist

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ios/ipa/SnapDrafter.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: false
